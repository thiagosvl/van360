name: Build e Upload iOS (App Store)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Número do Build (opcional)'
        required: false
        default: ''

jobs:
  build-and-upload-ios:
    name: Compilar e Subir para a Apple
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências Node
        run: npm install

      - name: Build da Aplicação Web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PUBLIC_APP_DOMAIN: ${{ secrets.VITE_PUBLIC_APP_DOMAIN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_EFI_ACCOUNT_ID: ${{ secrets.VITE_EFI_ACCOUNT_ID }}
          VITE_PUBLIC_CLARITY_ID: ${{ secrets.VITE_PUBLIC_CLARITY_ID }}
          VITE_PUBLIC_GTM_ID: ${{ secrets.VITE_PUBLIC_GTM_ID }}
          VITE_PUBLIC_FB_PIXEL_ID: ${{ secrets.VITE_PUBLIC_FB_PIXEL_ID }}
        run: npm run build

      - name: Sincronizar com Capacitor iOS
        run: npx cap sync ios

      - name: Instalar CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Configurar Chave da API da Apple
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Atualizar Build Number
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          echo "Definindo Build Number para: $BUILD_NUM"
          cd ios/App
          agvtool new-version -all "$BUILD_NUM"

      - name: Criar exportOptions.plist
        run: |
          cat <<EOF > ios/App/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>B2R9B4T4YR</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Gerar Archive no Xcode
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Exportar IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Enviar IPA para o App Store Connect
        run: |
          cd ios/App
          xcrun altool --upload-app \
            -f build/output/App.ipa \
            -t ios \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Salvar IPA como Artefato no GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Van360-iOS-IPA
          path: ios/App/build/output/*.ipa
          if-no-files-found: warn
